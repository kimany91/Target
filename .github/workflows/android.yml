name: Build & Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (search / ranking / deal engine)
        run: ./gradlew --no-daemon :engine:test

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.TARGET_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets TARGET_KEYSTORE_B64 / TARGET_KEYSTORE_PASSWORD absents : APK non publié (voir README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          TARGET_KEYSTORE: ${{ runner.temp }}/release.jks
          TARGET_KEYSTORE_PASSWORD: ${{ secrets.TARGET_KEYSTORE_PASSWORD }}
          TARGET_KEY_ALIAS: target
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PversionCode=$((VERSION_CODE + 1)) -PversionName=$VERSION_NAME
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Target-$VERSION_NAME.apk"
          cd dist && sha256sum "Target-$VERSION_NAME.apk" > "Target-$VERSION_NAME.apk.sha256"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          # refuse to publish an APK not signed by Target's key (updates would be rejected by the phones)
          "$APKSIGNER" verify --print-certs "Target-$VERSION_NAME.apk" | tee /dev/stderr \
            | grep -q "certificate SHA-256 digest: d2921437ae3651c51e5102e3028c5053c88c7eb346ea8c3a741f4c3bd4b586f7"

      - name: Build debug APK (no signing key)
        if: steps.signing.outputs.ready != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: target-apk
          path: |
            dist/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Publish release (auto-update channel)
        if: steps.signing.outputs.ready == 'true' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Target ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Mise à jour automatique de Target.
            Commit : ${{ github.sha }}
          files: |
            dist/Target-${{ env.VERSION_NAME }}.apk
            dist/Target-${{ env.VERSION_NAME }}.apk.sha256
